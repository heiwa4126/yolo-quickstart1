# envfile = ".env"

[executor]
type = "uv"

[env]
RUN_BASE = "src/yolo_quickstart1"
TRIVY_IGNORE = "--skip-dirs ./tmp,./xml"
SHELL = "bash"
BUS_SOURCE = "https://github.com/ultralytics/assets/releases/download/v0.0.0/bus.jpg"
IMG_SOURCE = "https://raw.githubusercontent.com/heiwa4126/jev-node1/main/example/imgs"

[tasks]
main = "yolo-quickstart1"

first_predict = "yolo predict model=yolo26n.pt project=\"$PWD/runs/detect\""

ex0 = "python -m yolo_quickstart1.ex0"

download_example0 = "mkdir -p examples output"
download_example1 = "curl -L \"$IMG_SOURCE/ex1.jpg\" -o examples/ex1.jpg"
download_example2 = "curl -L \"$IMG_SOURCE/ex2.jpg\" -o examples/ex2.jpg"
download_example3 = "curl -L \"$IMG_SOURCE/ex3.jpg\" -o examples/ex3.jpg"
download_example4 = "curl -L \"$IMG_SOURCE/ex4.jpg\" -o examples/ex4.jpg"
download_example5 = "curl -L \"$IMG_SOURCE/ex5.jpg\" -o examples/ex5.jpg"
download_example6 = "curl -L \"$IMG_SOURCE/ex6.jpg\" -o examples/ex6.jpg"
download_example = [
	"download_example0",
	"download_example1",
	"download_example2",
	"download_example3",
	"download_example4",
	"download_example5",
	"download_example6"
]

ex1 = "python -m yolo_quickstart1.ex1"

ex4m = "yolo predict model=yolo26m.pt source=./examples/ex4.jpg save_dir=\"$PWD/output\""
ex5 = "yolo predict model=yolo26n.pt source=./examples/ex5.jpg save_dir=\"$PWD/output\""
ex5m = "yolo predict model=yolo26m.pt source=./examples/ex5.jpg save_dir=\"$PWD/output\""
ex6 = "yolo predict model=yolo26n.pt source=./examples/ex6.jpg save_dir=\"$PWD/output\""
ex6m = "yolo predict model=yolo26m.pt source=./examples/ex6.jpg save_dir=\"$PWD/output\""

bounding_box = "yolo predict model=yolo26n.pt source=\"$BUS_SOURCE\" save_dir=\"$PWD/runs/bounding_box\""
segment = "yolo predict segment model=yolo26n-seg.pt source=\"$BUS_SOURCE\" save_dir=\"$PWD/runs/segment\""
semantic = "yolo predict semantic model=yolo26n-sem.pt source=\"$BUS_SOURCE\" save_dir=\"$PWD/runs/semantic\""

# ======== tests
test = "pytest -v --tb=short src"
tests = ["test"]

# ======== smoke tests
smoke1 = "uv run --isolated --no-project --with dist/*.whl pep440check"
smoke2 = "uv run --isolated --no-project --with dist/*.tar.gz pep440check"
smoke_test = ["smoke1", "smoke2"]

# ======== lint
check = "ruff check ./src"
# mypy = "mypy src"
mypy = "pyrefly check src"
pyrefly = "pyrefly check src"
pyproject_lint = "validate-pyproject pyproject.toml"
actionlint = "actionlint"

lint = ["check", "mypy", "pyproject_lint"]
lint_full = ["lint", "actionlint"]

# audit = "uvx uv-secure --show-severity --ignore-vulns GHSA-5239-wwwm-4pmq ./uv.lock"
# audit = "uvx uv-secure"
audit = "uv audit"

# ======== build
# clean = "rm -rf dist"
clean = "python -c \"import shutil; shutil.rmtree('dist', ignore_errors=True)\""
pack = "uv build"

# ======== build
build = ["audit", "build1"]

build1 = [
	"lint",
	# "format",
	"tests",
	# "actionlint",
	"clean",
	"pack",
	"smoke_test"
]


# ======== utils
format_python = "ruff format"
format_others.shell = "oxfmt"
format = ["format_python", "format_others"]

update.shell = "uv lock -U && uv sync"

uvsync = "uv sync"
requirements = "uv pip compile pyproject.toml --no-deps -o requirements.txt"
sync = ["uvsync", "requirements"]

trivy-config = "trivy config ."
trivy-fs = "trivy fs ${TRIVY_IGNORE} ."
trivy-check = ["trivy-config", "trivy-fs"]
trivy = ["trivy-check"]
trivy-license = "trivy fs ${TRIVY_IGNORE} --scanners license --severity HIGH,CRITICAL ."
trivy-sbom = "trivy fs ${TRIVY_IGNORE} --scanners vuln --format cyclonedx --output sbom.cdx.json ."
trivy-sbom-spdx = "trivy fs ${TRIVY_IGNORE} --scanners vuln --format spdx-json --output sbom.spdx.json ."
sbom = ["requirements", "trivy-sbom", "trivy-sbom-spdx"]

[tasks.testpypi]
help = "Build and upload to Test PyPI"
envfile = ".env"
cmd = """uv publish \
  --publish-url https://test.pypi.org/legacy/ \
  --token $TEST_PYPI_TOKEN"""
